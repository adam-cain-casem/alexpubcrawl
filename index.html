<style>

:root[data-theme="dark"]{--bg:#1a1511;--ink:#f1e8d8;--muted:#b3a58f;--card:#262019;--line:#e0794a;--road:#3b3226;--water:#1d2f35;--pin:#4fb3ac;--pinink:#10201f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IM Fell English",Georgia,"Times New Roman",serif;line-height:1.5}
main{max-width:520px;margin:0 auto;padding:16px}
h1{font-family:"IM Fell English SC",Georgia,serif;font-weight:400;font-size:1.75rem;letter-spacing:.08em;text-transform:uppercase;text-align:center;margin:.2em 0 .1em}.sub{text-align:center}
.sub{color:var(--muted);margin:0 0 12px;font-size:.95rem}

.water{fill:var(--water)}
.rd{fill:none;stroke:var(--road);stroke-width:7;stroke-linecap:round}
.rl{font:italic 15px "IM Fell English",Georgia,serif;fill:var(--muted)}.cas{fill:none;stroke:var(--card);stroke-width:14;stroke-linecap:round;stroke-linejoin:round}.kb{fill:var(--card);stroke:var(--road);stroke-width:2}.kt{font:14px "IM Fell English",Georgia,serif;fill:var(--ink)}.kp{fill:var(--muted);font-family:"Times New Roman",Times,serif;font-size:13px;font-variant-numeric:lining-nums}.pc{font-family:"Times New Roman",Times,serif;font-size:.9em}.qt{font:11px "IM Fell English SC",Georgia,serif;letter-spacing:1.4px;fill:var(--ink);opacity:.8}.tg{flex:none;padding:6px 14px;font-size:.9rem}.kc{fill:var(--pin)}.kn{font:bold 10px "Times New Roman",Times,serif;fill:var(--pinink);text-anchor:middle}
.seg{fill:none;stroke:var(--line);stroke-width:8;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.pin circle{fill:var(--pin);stroke:var(--card);stroke-width:4;cursor:pointer}
.pin text{fill:var(--pinink);font:bold 21px "Times New Roman",Times,serif;text-anchor:middle;pointer-events:none}
.pin.on circle{fill:var(--line)}
.card{background:var(--card);border-radius:14px;padding:16px;margin-top:12px;box-shadow:0 1px 6px rgba(0,0,0,.15)}
.card h2{margin:0 0 2px;font-size:1.25rem}
.addr{color:var(--muted);font-size:.85rem;margin:0 0 10px}

.walk{font-size:.9rem;color:var(--pin);margin-top:10px}.card img{width:100%;display:block;border-radius:4px;border:3px double var(--line);margin-bottom:10px}.cp{stroke:var(--ink);fill:none;stroke-width:1.5}.cpf{fill:var(--line);stroke:var(--ink);stroke-width:1}.cpt{font:18px "IM Fell English SC",serif;fill:var(--ink);text-anchor:middle;stroke:none}
.nav{display:flex;gap:8px;margin-top:12px}
button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--ink);font:inherit;cursor:pointer}
ol{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:4px}
ol button{text-align:left;border-color:var(--road);padding:8px 10px}
a{color:var(--pin)}.hm{fill:none;stroke:var(--pinink);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}.pin.home circle{fill:var(--ink)}.pin.home.on circle{fill:var(--line)}.maplink{text-align:center;margin:10px 0 0}

{n:"Gaucho Liverpool",a:"7 Water St, L2 0RD",x:199,y:272,h:"Formerly the Bank of Liverpool building (Il Palazzo), built in 1899 in the style of Palazzo Pompei. The Grade II listed building previously served as a bank and office space. The doors feature distinctive animal heads, often described locally as lions or tigers. Local legend has it that sailors leaving the port would stroke the open jaws of these bronze heads for luck before departing, and touch them again on a safe return. The fangs on the door handles are noticeably worn today."},
{n:"Ye Hole in Ye Wall",a:"4 Hackins Hey, L2 2AW",x:255,y:218,h:"The pub proudly displays a 1726 foundation date, tying its early history to the area’s development near an 18th-century Quaker burial ground and meeting house. The cosy wood-panelled interior largely dates from a major inter-war refit in the 1930s. Close to the commercial district and the docks, it became a heavily frequented sanctuary for Allied servicemen and American GIs, and it survived the bombing that devastated the surrounding area during the Blitz. Local folklore links the pub to paranormal sightings, including a figure in a long wax jacket and the ghost of an 18th-century Spanish sailor.",l:"https://www.bbc.co.uk/sounds/play/p0ndzxwp",lt:"Listen on BBC Sounds"},
{n:"Thomas Rigby’s",a:"23–25 Dale St, L2 2EZ",x:295,y:197,h:"A Grade II listed pub in the lower level of the landmark Rigby’s Buildings. The facade shows 1726, but the current structure was rebuilt around 1850–52. It is named after Alderman Thomas Rigby, a wine and spirits merchant who arrived in Liverpool around 1830 from humble beginnings and built a fortune through pubs and hotels. When he added the ornate stucco frontage in 1865, he wanted it to look ancient, choosing a dramatic imitation-medieval style. Look up and you will spot a range of hand-carved wooden grotesques staring down at passers-by on Dale Street."},
{n:"The Ship & Mitre",a:"133 Dale St, L2 2JH",x:459,y:95,h:"A Dale Street favourite among real-ale drinkers, known for a large rotating range of cask beers and ciders, just along from the Queensway Tunnel entrance. The pub has its roots as a coaching inn dating back to 1822, serving travellers on long stagecoach journeys. The name honours two pillars of local history: the “Ship” reflects Liverpool’s maritime and port heritage, while the “Mitre”, a bishop’s ceremonial headdress, represents the area’s religious roots."},
{n:"Doctor Duncan’s",a:"St John’s Ln, Queen Square, L1 1HF",x:538,y:170,h:"Named after Dr William Henry Duncan, who in 1847 became Britain’s first Medical Officer of Health, appointed by Liverpool at a time when overcrowded slums and repeated cholera and typhus outbreaks gave the city a terrible reputation. His tireless advocacy led to the Liverpool Sanitary Act of 1846 and fundamentally transformed public health standards across Britain. The pub building dates from 1901 and was designed by Alfred Waterhouse, the Liverpool-born architect and leading figure of the Gothic Revival, known for other works such as the Natural History Museum in London."},
{n:"The Jacaranda",a:"21–23 Slater St, L1 4BW",x:629,y:512,h:"Built between the late 18th and early 19th century as a Georgian merchant townhouse, 21 Slater Street later passed into commercial use and was a watch and clock repair shop when Allan Williams, later the Beatles’ first manager, leased it and opened the Jacaranda in September 1958. He turned it into a coffee bar with one of the city’s first Gaggia espresso machines, an American-style jukebox and live music in the basement. John Lennon, Paul McCartney, George Harrison and Stuart Sutcliffe became regulars, and Williams put the young band to work redecorating in exchange for rehearsal space and drinks, with Lennon and Sutcliffe painting a famous mural in the basement ladies’ powder room. Williams went on to take the group to Hamburg in August 1960, and the Beatles are said to have agreed and announced their definitive change of name at the venue shortly before the trip."},
{n:"The Monro",a:"Duke St, L1 5AG",x:592,y:573,h:"Built in the mid-18th century as a pair of grand merchant townhouses, the building originally catered to wealthy sea captains and traders during Liverpool’s rapid maritime expansion, before becoming a beer house around 1817. The pub was later named The Monro in honour of the HMS Monro, a packet ship that regularly sailed trade routes between Liverpool and New York.</p><p>Duke Street lies in the Ropewalks district, named for the long ropemaking yards that once supplied the port’s sailing ships. Many of the surrounding streets date from the 18th and 19th centuries, when merchants and shipping families built townhouses and warehouses here."},
{n:"The Bridewell",a:"1 Campbell Square, L1 5FB",x:447,y:541,h:"Built as the Campbell Square Bridewell to police the rough marine district and docks, it held over 100 petty offenders, vagabonds and intoxicated sailors each month. The novelist Charles Dickens reportedly had himself sworn in as a Liverpool special constable for a single night to patrol the area and gather inspiration for The Uncommercial Traveller. The building ceased operation as a prison in 1932. During the Second World War it saw secondary uses, including housing US military personnel and conscientious objectors. The disused cells and rooms later served as a rehearsal and writing space for local alternative bands, most notably Frankie Goes to Hollywood, who wrote much of their debut album Welcome to the Pleasuredome inside the building. A “bridewell” was the old term for a local jail or house of correction, and original cells survive inside."},
{n:"The Cavern Club",a:"8–10 Mathew St, L2 6RE",x:348,y:290,h:"The Cavern opened in January 1957 as a jazz club in the cellars of a Mathew Street warehouse, in a district of fruit and cotton warehouses. The Beatles are credited with nearly 300 appearances here between 1961 and 1963, and Brian Epstein first saw them play here in November 1961. British Rail obtained a compulsory purchase order in 1973 for an underground railway project, and the original venue was bulldozed and the cellar filled in. Following renewed interest after John Lennon’s death in 1980, the cellar was excavated, partially dismantled and rebuilt using thousands of saved original bricks. It reopened in 1984."}
